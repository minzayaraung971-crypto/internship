<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>

<style>
      body {
        margin: 0; 
        padding: 0;
        box-sizing: border-box;
      }
      table {
        border: 1px solid rgb(31, 30, 28);
        border-collapse: collapse;
        width: 50%;
        margin: auto;
        text-align: center;
        margin-top: 50px;
      }

      td,
      th {
        border: 1px dotted black;
          /* background-color: hwb(0 7% 57%);  */
 
      }

      .name{
        text-align:left;
         /* background-color: hwb(59 5% 22%); */
      }
      .roll{
        text-align:left;
         /* background-color: lch(32.57% 27.29 24.42); */
      }

      .mark{
        text-align:right;
         /* background-color: rgb(107, 96, 92); */
      }
      .sub{
        text-align:left;
         /* background-color: hwb(129 5% 22%); */
      }
      
</style>
</head>
<body>
    <table >
<tr>
    <th rowspan="2">No</th>
        <th rowspan="2">Student Name</th>
            <th rowspan="2">Gender</th>
                <th rowspan="2">Roll No.</th>
                    <th colspan="3">Marks</th>
</tr>
<tr>
    <th class="sub" >Myanmar</th>
        <th class="sub" >English</th>
            <th class="sub" >Maths</th>
</tr>
<tr> 
        <td class="no">1</td>
        <td class="name">Su Su</td>
        <td class="gender" rowspan="2">Female</td>
        <td class="roll">5CS-32</td>
        <td class="mark">60</td>
        <td class="mark">75</td>
        <td class="mark">86</td>
</tr>
 <tr>
        <td class="no">2</td>
        <td class="name">Moe Moe</td>
        <td class="roll">5CS-33</td>
        <td class="mark">78</td>
        <td class="mark">86</td>
        <td class="mark">84</td>
      </tr>
      <tr>
        <td class="no">3</td>
        <td class="name">Kyaw Kyaw</td>
        <td class="gender" rowspan="3">Male</td>
        <td class="roll">5CS-34</td>
        <td class="mark">89</td>
        <td class="mark">43</td>
        <td class="mark">86</td>
      </tr>
      <tr>
        <td class="no">4</td>
        <td class="name">Mg Mg</td>
        <td class="roll">5CS-35</td>
        <td class="mark">76</td>
        <td class="mark">75</td>
        <td class="mark">75</td>
      </tr>
      <tr>
        <td class="no">5</td>
        <td class="name">Aung Aung</td>
        <td class="roll">5CS-36</td>
        <td class="mark">87</td>
        <td class="mark">75</td>
        <td class="mark">86</td>
      </tr>

    </table>
</body>
</html>
