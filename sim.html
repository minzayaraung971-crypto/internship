<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Utility Simulator</title>
    <style>
.body{
    background-color: rgb(0, 0, 0);
    margin: 0px;
    padding: 30px;
}
.title{
border-radius: 15px;

}
nav{
    background: blueviolet;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    margin: 20px 0;
}
.navlinks a{
    color: white;
    text-decoration: none;
    margin-left: 20px;
}
.features{
    display: flex;
    gap:20px ;
    margin-bottom: 10px;
}
.feature-box{
    flex: 1;
    background: #7996b3;
    padding: 20px;
    text-align: center;
    border-radius: 5px;
}
.main{
    max-width: 450px;
    margin: 30px;
    background: white;
    padding: 30px;
    border-radius: 7px;
    flex: 1;
}
.container{
    display: flex;
    gap: 30px;
}
.main {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        /* background-color: brown; */
        border: 1px solid black;
        border-radius: 5px;
        padding: 20px;
}
.card {
        border: 1px dotted black;
        background-color: white;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        /* text-align:center; */
      }

      .colorCard {
        width: 400px;
        height: 150px;
        background-color: rgb(26, 26, 123);
        border: none;
        /* display:flex;
        flex-direction:column;
        justify-content: center;
        align-items:center; */
        padding: 30px;
        color: white;
      }
.colorCard h3 {
        color: white;
        margin-bottom: 15px;
      }
      .button {
        display: flex;
        gap: 20px;
        /* background-color: yellow; */
        padding-left: 50px;
        /* margin:20px; */
      }

      .btn {
        background-color: rgb(31, 31, 137);
        border: none;
        border-radius: 3px;
        padding: 10px;
        color: white;
        font-weight: bold;
        /* margin-left:30px;
        column-gap:5px; */
        cursor: pointer;
      }
    </style>

</head>
<body>
    <div class="title">
        <h2>CSS Utility Simulator</h2>
        <p>
            Change the inputs below to see how atomic classes combine to build UIs
        </p>
<nav>
    <div class="logo" >My Logo</div>
    <div class="navlinks">
    <a href="">Home</a>
     <a href="">About</a>
      <a href="">Content</a>
      </div>
</nav>
<div class="features">
    <div class="feature-box">Feature 1</div>
        <div class="feature-box">Feature 2</div>
    <div class="feature-box">Feature 3</div>

</div>
<div class="container">
    <div class="main">
        <h2>Utility Controls</h2>
        <label for="">Padding(Spacing)</label>
        <select>
            <option value="Medium(p-8)">Medium(p-8)</option>
        </select>
         <label for="">Background Theme(Colors)</label>
        <select>
            <option value="Primary Blue">Primary Blue</option>
        </select>
         <label for="">Text Size(Typography)</label>
        <select>
            <option value="Large(text-xl)">Large(text-xl)</option>
        </select>
        <label for="">Corner Radius (Borders)</label>
        <select>
          <option value="Square (rounded-none)">Square (rounded-none)</option>
        </select>

        <label for="">Shadow (Depth)</label>
        <select>
          <option value="Medium (shadow-md)">Medium (shadow-md)</option>
        </select>
      </div>
    </div>
</div>
    </div>
    <div class="card">
        <div class="colorCard">
          <h3>Alex Walker</h3>
          <p>
            Full-Stack Web Developer building awesome things with Tailwind CSS.
          </p>
        </div>
      </div>
      <!-- right -->
    </div>
    <div class="button">
      <input type="submit" value="Submit" class="btn" />
      <button class="btn">Hover Me Slowly!</button>
    </div>
    
</body>
</html>
